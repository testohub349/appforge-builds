name: AppForge Toolchain Self-Test

on:
  push:
    paths:
      - '.github/workflows/toolchain-selftest.yml'
      - 'scaffold.js'

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;34.0.0'

      - name: Prepare Bubblewrap SDK compatibility
        run: |
          set -euo pipefail
          SDKMANAGER_PATH="$(command -v sdkmanager)"
          SDKMANAGER_DIR="$(dirname "$(readlink -f "$SDKMANAGER_PATH")")"
          if [ ! -e "$ANDROID_HOME/bin" ]; then
            ln -s "$SDKMANAGER_DIR" "$ANDROID_HOME/bin"
          fi
          test -x "$ANDROID_HOME/bin/sdkmanager"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create test manifest and signing key
        run: |
          set -euo pipefail
          mkdir -p work
          cat > selftest-manifest.json <<'JSON'
          {
            "packageId": "com.appforge.toolchain.selftest",
            "host": "example.com",
            "name": "AppForge Test",
            "launcherName": "AF Test",
            "display": "standalone",
            "themeColor": "#0f766e",
            "themeColorDark": "#0b0f0e",
            "navigationColor": "#0f766e",
            "navigationColorDark": "#0b0f0e",
            "navigationDividerColor": "#0f766e",
            "navigationDividerColorDark": "#0b0f0e",
            "backgroundColor": "#0f766e",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "maskableIconUrl": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "shortcuts": [],
            "signingKey": { "path": "./android.keystore", "alias": "android" },
            "appVersion": "1.0.1",
            "appVersionCode": 1,
            "orientation": "default",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "fallbackType": "customtabs",
            "features": {},
            "generatorApp": "AppForge AI Self-Test"
          }
          JSON
          python3 -m http.server 8765 >/tmp/appforge-selftest-http.log 2>&1 &
          echo $! > /tmp/appforge-selftest-http.pid
          sleep 1
          curl -fsS http://127.0.0.1:8765/selftest-manifest.json >/dev/null

          KEYSTORE_PASS='appforge-selftest-password'
          echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          keytool -genkeypair \
            -keystore work/android.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 30 \
            -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
            -dname "CN=AppForge Self Test, O=AppForge AI, C=US"

      - name: Scaffold project
        run: node scaffold.js http://127.0.0.1:8765/selftest-manifest.json ./work/project

      - name: Target API 36 and configure Bubblewrap
        run: |
          set -euo pipefail
          sed -Ei 's/targetSdkVersion[[:space:]]+[0-9]+/targetSdkVersion 36/' work/project/app/build.gradle
          grep -qE 'compileSdkVersion[[:space:]]+36' work/project/app/build.gradle
          grep -qE 'targetSdkVersion[[:space:]]+36' work/project/app/build.gradle
          cp work/android.keystore work/project/android.keystore
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Build APK and AAB
        working-directory: work/project
        run: |
          set -euo pipefail
          npx --package=@bubblewrap/cli@1.24.1 -- bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath=./android.keystore \
            --signingKeyAlias=android \
            --keystorePassword="$KEYSTORE_PASS" \
            --keyPassword="$KEY_PASS"
          APK=$(find . -name '*.apk' -type f | head -n1)
          AAB=$(find . -name '*.aab' -type f | head -n1)
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          echo "Self-test APK: $APK ($(stat -c%s "$APK") bytes)"
          echo "Self-test AAB: $AAB ($(stat -c%s "$AAB") bytes)"
