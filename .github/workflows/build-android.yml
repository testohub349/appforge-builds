name: AppForge Android Build

on:
  repository_dispatch:
    types: [appforge-build]
  workflow_dispatch:
    inputs:
      build_id:
        description: 'AppForge build id'
        required: true
      manifest_url:
        description: 'URL to web manifest'
        required: true
      twa_manifest_url:
        description: 'URL to TWA manifest'
        required: true
      callback_url:
        description: 'Callback URL'
        required: true
      callback_secret:
        description: 'HMAC secret'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUILD_ID: ${{ github.event.client_payload.build_id || inputs.build_id }}
      APP_ID: ${{ github.event.client_payload.app_id }}
      MANIFEST_URL: ${{ github.event.client_payload.manifest_url || inputs.manifest_url }}
      TWA_MANIFEST_URL: ${{ github.event.client_payload.twa_manifest_url || inputs.twa_manifest_url }}
      CALLBACK_URL: ${{ github.event.client_payload.callback_url || inputs.callback_url }}
      CALLBACK_SECRET: ${{ github.event.client_payload.callback_secret || inputs.callback_secret }}
      SUPABASE_URL: ${{ github.event.client_payload.supabase_url }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      UPLOAD_PREFIX: ${{ github.event.client_payload.upload_prefix }}

    steps:
      - name: Checkout build runner
        uses: actions/checkout@v4

      - name: Report running
        run: |
          curl -s -X POST "$CALLBACK_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Appforge-Secret: $CALLBACK_SECRET" \
            -d "{\"status\":\"running\",\"logs\":\"Runner started on GitHub Actions\",\"gh_run_id\":\"${{ github.run_id }}\"}" || true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'

      - name: Install runner dependencies
        run: npm ci || npm install

      - name: Generate keystore
        run: |
          mkdir -p work
          cd work
          KEYSTORE_PASS=$(openssl rand -hex 16)
          echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASS=$KEYSTORE_PASS" >> $GITHUB_ENV
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
            -dname "CN=AppForge, OU=Generated, O=AppForge AI, L=Cloud, S=NA, C=US"

      - name: Scaffold TWA project (non-interactive)
        run: node scaffold.js "$TWA_MANIFEST_URL" ./work/project

      - name: Copy keystore into project
        run: cp work/android.keystore work/project/android.keystore

      - name: Configure Bubblewrap CLI paths
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Bubblewrap build
        working-directory: work/project
        run: |
          npx --package=@bubblewrap/cli@1.24.1 -- bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath=./android.keystore \
            --signingKeyAlias=android \
            --keystorePassword="$KEYSTORE_PASS" \
            --keyPassword="$KEY_PASS"
          echo "Contents after build:"
          ls -la
          echo "APKs:" && find . -name '*.apk' 2>/dev/null
          echo "AABs:" && find . -name '*.aab' 2>/dev/null

      - name: Locate outputs
        id: outputs
        working-directory: work/project
        run: |
          APK=$(find . -name '*-release-signed.apk' 2>/dev/null | head -n1)
          if [ -z "$APK" ]; then APK=$(find . -name '*.apk' 2>/dev/null | head -n1); fi
          AAB=$(find . -name '*-release-bundle.aab' 2>/dev/null | head -n1)
          if [ -z "$AAB" ]; then AAB=$(find . -name '*.aab' 2>/dev/null | head -n1); fi
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "aab=$AAB" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          echo "Found AAB: $AAB"

      - name: Upload artifacts to Supabase Storage
        id: upload
        working-directory: work/project
        run: |
          APK_PATH="${{ steps.outputs.outputs.apk }}"
          AAB_PATH="${{ steps.outputs.outputs.aab }}"
          APK_KEY="$UPLOAD_PREFIX/app-release-signed.apk"
          AAB_KEY="$UPLOAD_PREFIX/app-release-bundle.aab"
          APK_SIZE=0
          AAB_SIZE=0
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            APK_SIZE=$(stat -c%s "$APK_PATH")
            echo "Uploading APK ($APK_SIZE bytes)..."
            curl -sSf -X POST "$SUPABASE_URL/storage/v1/object/appforge-artifacts/$APK_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Content-Type: application/vnd.android.package-archive" \
              -H "x-upsert: true" \
              --data-binary @"$APK_PATH"
            echo "apk_key=$APK_KEY" >> $GITHUB_OUTPUT
          fi
          if [ -n "$AAB_PATH" ] && [ -f "$AAB_PATH" ]; then
            AAB_SIZE=$(stat -c%s "$AAB_PATH")
            echo "Uploading AAB ($AAB_SIZE bytes)..."
            curl -sSf -X POST "$SUPABASE_URL/storage/v1/object/appforge-artifacts/$AAB_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Content-Type: application/octet-stream" \
              -H "x-upsert: true" \
              --data-binary @"$AAB_PATH"
            echo "aab_key=$AAB_KEY" >> $GITHUB_OUTPUT
          fi
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "aab_size=$AAB_SIZE" >> $GITHUB_OUTPUT

      - name: Report success
        if: success()
        run: |
          curl -sSf -X POST "$CALLBACK_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Appforge-Secret: $CALLBACK_SECRET" \
            -d "{\"status\":\"success\",\"apk_file\":\"${{ steps.upload.outputs.apk_key }}\",\"aab_file\":\"${{ steps.upload.outputs.aab_key }}\",\"apk_size\":${{ steps.upload.outputs.apk_size || 0 }},\"aab_size\":${{ steps.upload.outputs.aab_size || 0 }},\"logs\":\"Build completed and artifacts uploaded.\",\"gh_run_id\":\"${{ github.run_id }}\"}"

      - name: Report failure
        if: failure()
        run: |
          curl -s -X POST "$CALLBACK_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Appforge-Secret: $CALLBACK_SECRET" \
            -d "{\"status\":\"failed\",\"logs\":\"Build failed. See GitHub Actions run ${{ github.run_id }} for details.\",\"gh_run_id\":\"${{ github.run_id }}\"}" || true
