name: WebView Smoke Test Build

# Manual trigger only - proves the webview-template project actually compiles,
# independent of the real build-webview.yml pipeline which needs a full
# client_payload (app config, keystore, etc). No secrets required here.
# NOTE: lives at repo root .github/workflows/ because GitHub Actions only
# scans workflows there, not in nested webview-template/.github/workflows/.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webview-template
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No Gradle Wrapper is committed to this repo (gradle-wrapper.jar is a
      # binary file), so install Gradle directly on the runner instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: appforge-webview-debug-apk
          path: webview-template/app/build/outputs/apk/debug/app-debug.apk
